<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --ink:#17212b; --muted:#687684; --line:#dfe5ea; --paper:#f7f9fb; --card:#fff; --blue:#1f6feb; --teal:#0f766e; --orange:#c2410c; --purple:#7c3aed; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    .app { display:grid; grid-template-columns:minmax(300px,390px) 1fr; height:100vh; min-height:640px; }
    aside { overflow:auto; border-right:1px solid var(--line); background:var(--card); padding:22px 20px; }
    h1 { margin:0 0 6px; font-size:22px; line-height:1.25; letter-spacing:0; }
    .lede { color:var(--muted); font-size:13px; margin:0 0 16px; line-height:1.55; }
    .days { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
    .day { appearance:none; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:7px; padding:8px 10px; font-size:13px; cursor:pointer; }
    .day.active { border-color:var(--blue); background:#eaf2ff; color:#174ea6; font-weight:600; }
    .summary { font-size:12px; color:var(--muted); padding:10px 0 13px; border-bottom:1px solid var(--line); }
    .stop { border-bottom:1px solid var(--line); padding:14px 0; cursor:pointer; }
    .stop:hover, .stop.selected { background:#f2f7ff; margin:0 -10px; padding-left:10px; padding-right:10px; }
    .stop-head { display:flex; gap:8px; align-items:baseline; }
    .num { color:var(--blue); font-variant-numeric:tabular-nums; font-weight:700; width:22px; }
    .stop h2 { font-size:15px; margin:0; line-height:1.35; }
    .stop p { margin:5px 0 0 30px; color:var(--muted); font-size:12px; line-height:1.5; }
    .tag { display:inline-block; margin:7px 0 0 30px; padding:2px 6px; border-radius:4px; background:#eef2f6; color:#52606d; font-size:11px; }
    .tag.approx { background:#fff2e8; color:#9a3412; }
    .detail { display:none; border-top:1px solid var(--line); margin-top:10px; padding-top:11px; font-size:12px; line-height:1.55; }
    .stop.selected .detail { display:block; }
    .detail strong { color:var(--ink); }
    .detail a { color:var(--blue); text-decoration:none; }
    .detail a:hover { text-decoration:underline; }
    #map { height:100%; min-height:640px; }
    .leaflet-popup-content { margin:12px 14px; min-width:220px; }
    .popup-title { font-weight:700; font-size:15px; margin-bottom:4px; }
    .popup-meta { color:#586675; font-size:12px; line-height:1.5; }
    .popup-link { display:inline-block; margin-top:8px; color:#1f6feb; font-size:12px; text-decoration:none; }
    .legend { position:absolute; right:14px; bottom:18px; z-index:500; background:rgba(255,255,255,.94); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:11px; line-height:1.7; box-shadow:0 1px 4px rgba(23,33,43,.12); }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:0; }
    .source-note { margin-top:16px; color:var(--muted); font-size:11px; line-height:1.5; }
    .source-note a { color:var(--blue); }
    @media (max-width:780px) { .app { grid-template-columns:1fr; grid-template-rows:52vh auto; height:auto; } #map { min-height:52vh; grid-row:1; } aside { grid-row:2; border-right:0; border-top:1px solid var(--line); } .legend { bottom:auto; top:14px; } }
  </style>
</head>

    <div class="summary" id="summary" aria-live="polite"></div>
    <section id="stops" aria-label="行程地点"></section>
    <div class="source-note">坐标底图：<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>。海岛沙滩与观景点以景区/村落附近约略坐标表示；出发前请以官方票务和当日船班为准。</div>
  </aside>
  <div id="map" aria-label="行程交互地图"></div>
</main>

const colors = {杭州:'#1f6feb', 宁波:'#0f766e', 枸杞岛:'#c2410c', 泗礁岛:'#7c3aed', 岱山:'#b45309', 上海:'#475569'};

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markerLayer = L.layerGroup().addTo(map); const lineLayer = L.layerGroup().addTo(map); const markerRefs = new Map();
const dayRoute = {

function popup(s){ return `<div class="popup-title">${s.name}</div><div class="popup-meta">D${s.day} · ${s.city} · ${s.kind}<br>${s.time}<br>${s.note}</div><a class="popup-link" href="${s.source}" target="_blank" rel="noopener">${s.sourceLabel} ↗</a>`; }
function draw(day){
  markerLayer.clearLayers(); lineLayer.clearLayers(); markerRefs.clear();
  const visible = day === 0 ? stops : stops.filter(s=>s.day===day);
  visible.forEach((s,i)=>{ const color=colors[s.city]||'#334155'; const m=L.circleMarker([s.lat,s.lon],{radius:7,weight:2,color:'#fff',fillColor:color,fillOpacity:.95}); m.bindPopup(popup(s)); m.on('click',()=>selectStop(s)); m.addTo(markerLayer); markerRefs.set(s.name,m); });
  const routes = day === 0 ? Object.values(dayRoute) : [dayRoute[day]];
  routes.filter(Boolean).forEach((pts,idx)=>L.polyline(pts,{color:day===0?'#64748b':(colors[visible[0]?.city]||'#1f6feb'),weight:3,opacity:.72,dashArray:day===0?'6 7':null}).addTo(lineLayer));
  if(visible.length){ const bounds=L.latLngBounds(visible.map(s=>[s.lat,s.lon])); map.fitBounds(bounds.pad(.18),{maxZoom:day===0?8:13}); }
  renderList(day, visible);
}
function renderList(day, visible){ const wrap=document.getElementById('stops'); wrap.innerHTML=''; visible.forEach((s,i)=>{ const el=document.createElement('article'); el.className='stop'; el.dataset.name=s.name; el.innerHTML=`<div class="stop-head"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${s.name}</h2></div><p>${s.time} · ${s.kind}</p><span class="tag ${s.approx?'approx':''}">${s.approx?'约略坐标':'已核验/可检索'}</span><div class="detail"><strong>行程说明：</strong>${s.note}<br><strong>出处：</strong><a href="${s.source}" target="_blank" rel="noopener">${s.sourceLabel} ↗</a></div>`; el.onclick=()=>selectStop(s); wrap.appendChild(el); }); document.getElementById('summary').textContent=`${day===0?'全程':`D${day}`} · ${visible.length} 个地点。路线线段为行程示意，跨城/跨海段不代表实际道路或航线。`; }
function selectStop(s){ document.querySelectorAll('.stop').forEach(x=>x.classList.toggle('selected',x.dataset.name===s.name)); const m=markerRefs.get(s.name); if(m){ map.setView([s.lat,s.lon],Math.max(map.getZoom(),13),{animate:true}); m.openPopup(); } }
const days=document.getElementById('days'); [{n:0,t:'全程'},...Array.from({length:6},(_,i)=>({n:i+1,t:`D${i+1}`}))].forEach(d=>{ const b=document.createElement('button'); b.className='day'+(d.n===0?' active':''); b.textContent=d.t; b.type='button'; b.onclick=()=>{document.querySelectorAll('.day').forEach(x=>x.classList.remove('active')); b.classList.add('active'); draw(d.n);}; days.appendChild(b); });
draw(0);
</script>
</body>
